[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ephys-qc-workbench"
dynamic = ["version"]
description = "Modular electrophysiology quality-control toolkit with an optional local workbench"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
research = ["mne-faster==1.2.2", "spikeinterface==0.104.2"]
nwb = ["pynwb>=3.1.3,<4", "h5py>=3.8,<4"]

[project.scripts]
dbci-qc = "ephys_qc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ephys_qc.version.__version__"}

# Execution uses an explicitly configured Python environment containing the
# separately obtained BrainElecQC package. Third-party source is not vendored.

[tool.setuptools.package-data]
ephys_qc = ["octave/*.m", "octave/compat/*.m"]
