name: Change log
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  change-log:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release notes for behavior and default changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_change_log.py --base "$BASE_SHA"
