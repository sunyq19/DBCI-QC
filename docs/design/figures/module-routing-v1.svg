<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>质控模块与数据流</title><desc>统一读入与确认；每份记录做信号检查，数据包增加完整性与一致性核对。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7894b5" stroke-width="1.4"/></marker></defs>
<rect width="1920" height="1080" fill="#f7f9fc"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="80" y="68" font-size="20" fill="#245bd6" font-weight="600">DBCI-QC  /  模块化设计</text>
<text x="80" y="128" font-size="42" fill="#152f50" font-weight="700">质控模块与数据流</text>
<text x="80" y="166" font-size="24" fill="#58718d" font-weight="400">统一读入与确认；每份记录做信号检查，数据包增加完整性与一致性核对。</text>
<rect x="80" y="210" width="330" height="112" rx="18" fill="white" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="106" y="256" font-size="29" fill="#152f50" font-weight="600">一份记录 / 一组记录</text>
<text x="106" y="296" font-size="23" fill="#58718d" font-weight="400">保留原始文件与配套资料</text>
<rect x="470" y="210" width="500" height="112" rx="18" fill="white" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="498" y="249" font-size="29" fill="#245bd6" font-weight="600">M01  文件读取</text>
<text x="498" y="293" font-size="24" fill="#58718d" font-weight="400">格式、通道、时长、采样率、单位</text>
<rect x="1030" y="210" width="810" height="112" rx="18" fill="white" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="1058" y="249" font-size="29" fill="#245bd6" font-weight="600">M02  信息确认与检查方案</text>
<text x="1058" y="293" font-size="24" fill="#58718d" font-weight="400">确认模态、分析通道与范围；按技术条件选择方法</text>
<path d="M410 266H457" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M970 266H1017" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1435 322V351H295V380" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1435 351V380" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="80" y="390" width="430" height="466" rx="18" fill="white" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="106" y="433" font-size="29" fill="#152f50" font-weight="600">数据包核对</text>
<text x="106" y="470" font-size="23" fill="#58718d" font-weight="400">有应有清单与核对方案时</text>
<rect x="103" y="497" width="384" height="97" rx="12" fill="#f5f8fc" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="122" y="533" font-size="20" fill="#245bd6" font-weight="600">D01</text>
<text x="181" y="533" font-size="27" fill="#152f50" font-weight="600">文件完整性</text>
<text x="122" y="572" font-size="23" fill="#58718d" font-weight="400">应到 / 实到、缺件与结构</text>
<rect x="103" y="607" width="384" height="97" rx="12" fill="#f5f8fc" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="122" y="643" font-size="20" fill="#245bd6" font-weight="600">D02</text>
<text x="181" y="643" font-size="27" fill="#152f50" font-weight="600">个体及文件对应</text>
<text x="122" y="682" font-size="23" fill="#58718d" font-weight="400">编号、通道、单位、事件</text>
<rect x="103" y="717" width="384" height="97" rx="12" fill="#f5f8fc" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="122" y="753" font-size="20" fill="#245bd6" font-weight="600">D03</text>
<text x="181" y="753" font-size="27" fill="#152f50" font-weight="600">同组一致性</text>
<text x="122" y="792" font-size="23" fill="#58718d" font-weight="400">采集配置、表结构、重复线索</text>
<rect x="550" y="390" width="1290" height="466" rx="18" fill="white" stroke="#d8e3ef" stroke-width="1.5"/>
<text x="578" y="433" font-size="29" fill="#152f50" font-weight="600">每份记录的信号检查</text>
<text x="578" y="470" font-size="23" fill="#58718d" font-weight="400">头皮 EEG / ECoG / sEEG / Neuropixels 电压：框架相同，内部方法不同</text>
<rect x="578" y="494" width="398" height="132" rx="14" fill="#f3f7ff" stroke="#d0def7" stroke-width="1.5"/>
<text x="600" y="527" font-size="19" fill="#245bd6" font-weight="600">M03 · 默认推荐</text>
<text x="600" y="566" font-size="29" fill="#152f50" font-weight="600">信号完整性</text>
<text x="600" y="602" font-size="22" fill="#58718d" font-weight="400">缺失、恒值、异常区间</text>
<rect x="996" y="494" width="398" height="132" rx="14" fill="#f3f7ff" stroke="#d0def7" stroke-width="1.5"/>
<text x="1018" y="527" font-size="19" fill="#245bd6" font-weight="600">M04 · 默认推荐</text>
<text x="1018" y="566" font-size="29" fill="#152f50" font-weight="600">频谱与干扰</text>
<text x="1018" y="602" font-size="22" fill="#58718d" font-weight="400">PSD、可测频率的工频观察</text>
<rect x="1414" y="494" width="398" height="132" rx="14" fill="#f3f7ff" stroke="#d0def7" stroke-width="1.5"/>
<text x="1436" y="527" font-size="19" fill="#245bd6" font-weight="600">M05 · 默认推荐</text>
<text x="1436" y="566" font-size="29" fill="#152f50" font-weight="600">通道质量</text>
<text x="1436" y="602" font-size="22" fill="#58718d" font-weight="400">逐道指标；满足条件再判候选</text>
<path d="M777 626V656" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="578" y="670" width="606" height="154" rx="14" fill="#f0f9f9" stroke="#c5e3e4" stroke-width="1.5"/>
<text x="600" y="703" font-size="19" fill="#147d83" font-weight="600">M06 · 条件检查</text>
<text x="600" y="742" font-size="29" fill="#152f50" font-weight="600">伪迹线索</text>
<text x="600" y="778" font-size="22" fill="#58718d" font-weight="400">EEG：辅助导联 / 可用高频带</text>
<text x="600" y="809" font-size="22" fill="#58718d" font-weight="400">ECoG、sEEG：手动研究扩展</text>
<rect x="1206" y="670" width="606" height="154" rx="14" fill="#f0f9f9" stroke="#c5e3e4" stroke-width="1.5"/>
<text x="1228" y="703" font-size="19" fill="#147d83" font-weight="600">M07 · 条件检查</text>
<text x="1228" y="742" font-size="29" fill="#152f50" font-weight="600">事件与时间</text>
<text x="1228" y="778" font-size="22" fill="#58718d" font-weight="400">已有登记的事件表或睡眠分期</text>
<text x="1228" y="809" font-size="22" fill="#58718d" font-weight="400">核对位置与覆盖范围</text>
<path d="M295 856V895" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1195 856V895" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="80" y="908" width="430" height="98" rx="14" fill="#eaf1ff" stroke="#c6d6f5" stroke-width="1.5"/>
<text x="106" y="949" font-size="29" fill="#245bd6" font-weight="600">数据集总览</text>
<text x="106" y="984" font-size="23" fill="#58718d" font-weight="400">资料问题 + 各份信号报告</text>
<rect x="550" y="908" width="1290" height="98" rx="14" fill="#eaf1ff" stroke="#c6d6f5" stroke-width="1.5"/>
<text x="578" y="949" font-size="29" fill="#245bd6" font-weight="600">M08 分项汇总  →  M09 单份报告</text>
<text x="578" y="984" font-size="23" fill="#58718d" font-weight="400">候选位置、分项结果、已评范围、未评原因；EEG 满足评分条件时提供试行分数</text>
<path d="M550 957H519" fill="none" stroke="#7894b5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1130" y="1044" font-size="18" fill="#58718d" font-weight="400">逻辑数据流；数据集批量启动信号检查尚未接入</text>
<text x="80" y="1044" font-size="18" fill="#58718d" font-weight="400">模块路由 v1.0  ·  2026-11-06  ·  工程设计基线</text>
</g></svg>